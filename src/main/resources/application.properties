spring.application.name=springaicourse
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-5-nano
spring.ai.openai.embedding.model=text-embedding-3-small
spring.ai.openai.chat.temperature=1.0
# OpenAI is the primary chat model by default

# Keep the default RAG path in-memory. Lab 13 opts into Redis explicitly.
spring.ai.vectorstore.type=simple

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.model=claude-sonnet-4-5

# Redis settings are now in application-redis.properties profile
# Use --spring.profiles.active=rag,redis to enable Redis vector store

# Audio settings for OpenAI (these are all default values; included here to document what's possible)
# Text-to-Speech (TTS) options
spring.ai.openai.audio.speech.model=tts-1
spring.ai.openai.audio.speech.voice=alloy
spring.ai.openai.audio.speech.response-format=mp3
spring.ai.openai.audio.speech.speed=1.0

# Speech-to-Text (Transcription) options
spring.ai.openai.audio.transcription.model=whisper-1
spring.ai.openai.audio.transcription.language=en
spring.ai.openai.audio.transcription.temperature=0.0
spring.ai.openai.audio.transcription.response-format=text

logging.level.org.springframework.ai=info
logging.level.org.springframework.ai.chat.client.advisor=debug
#logging.level.web=debug
